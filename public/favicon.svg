<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background vibrant blue-to-cyan gradient -->
    <linearGradient id="bf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Soft drop shadow for flame -->
    <filter id="bf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>

    <!-- Flame inner gradient -->
    <linearGradient id="bf-flame-inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Flame core accent gradient -->
    <linearGradient id="bf-core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Tile (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bf-bg)" />
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="#93c5fd" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Outer Flame Body (White Glow) -->
  <g filter="url(#bf-shadow)">
    <!-- Stylized Crisp High-Contrast Flame Shape -->
    <path
      d="M32 9C32 9 37 15 38 21C39 23 42 27 46 29C49 31.5 50 35 50 38.5C50 47 42 54 32 54C21 54 14 46.5 14 38C14 27 23 18 27 13C25 18 26 23 28 25C30 19 32 9 32 9Z"
      fill="url(#bf-flame-inner)"
    />

    <!-- Inner Core Accent Droplet/Flame -->
    <path
      d="M32 29C32 29 27 35 27 40C27 44 29 46.5 32 46.5C35 46.5 37 44 37 40C37 36 34 33 32 29Z"
      fill="url(#bf-core)"
    />
  </g>

  <!-- Dynamic Food Delivery Motion / Sparkles -->
  <circle cx="48" cy="16" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="53" cy="23" r="1.5" fill="#bae6fd" opacity="0.8" />
</svg>